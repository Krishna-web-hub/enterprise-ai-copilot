# ============================================================
# CI Pipeline - Enterprise AI Analytics Copilot
# ============================================================
# Runs on every push and pull request to main/develop branches.
# Jobs: backend (lint + test), frontend (typecheck + build)
#
# Fail fast: if any step fails, the whole pipeline fails.
# Tests run against SQLite in-memory (no external services needed).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"

jobs:
  # ─── Backend: Lint + Test ────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install "torch==2.5.1+cpu" "torchvision==0.20.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          pip install aiosqlite ruff

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
        env:
          JWT_SECRET_KEY: ci-test-secret-key
          OPENAI_API_KEY: ""
          POSTGRES_HOST: localhost
          POSTGRES_DB: test_db

  # ─── Frontend: Typecheck + Build ─────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api/v1

  # ─── Docker Build Verification ──────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t copilot-backend ./backend

      - name: Build frontend image
        run: docker build -t copilot-frontend ./frontend

      - name: Verify images created
        run: |
          docker images copilot-backend
          docker images copilot-frontend
