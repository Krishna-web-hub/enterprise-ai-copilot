# ============================================================
# Alembic Configuration
# ============================================================
# Alembic is the migration tool for SQLAlchemy.
# It tracks schema changes (like git for your database).
#
# Why migrations instead of create_all()?
# - create_all() can't modify existing tables
# - Migrations are versioned and reversible
# - Teams can coordinate schema changes
# - Production deployments need controlled migrations

[alembic]
script_location = migrations
prepend_sys_path = .

# The sqlalchemy.url is overridden in env.py to use settings
# This fallback is for offline mode only
sqlalchemy.url = postgresql://copilot_user:change_me_in_production@localhost:5432/ai_copilot

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
