# ============================================================
# Google Cloud Build Pipeline for Enterprise AI Copilot
# Region: asia-south1 (Mumbai)
# ============================================================
steps:
  # Step 1: Build the container image using the root Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/enterprise-ai-copilot/enterprise-ai-copilot:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/enterprise-ai-copilot/enterprise-ai-copilot:latest'
      - '.'
      - '-f'
      - 'Dockerfile'

  # Step 2: Push the image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/enterprise-ai-copilot/enterprise-ai-copilot'

  # Step 3: Deploy image to Cloud Run service in asia-south1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'enterprise-ai-copilot'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/enterprise-ai-copilot/enterprise-ai-copilot:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/enterprise-ai-copilot/enterprise-ai-copilot:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/enterprise-ai-copilot/enterprise-ai-copilot:latest'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
