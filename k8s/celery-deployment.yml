apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-celery
  namespace: ai-copilot
  labels:
    app: copilot-celery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: copilot-celery
  template:
    metadata:
      labels:
        app: copilot-celery
    spec:
      containers:
        - name: celery-worker
          image: your-registry/copilot-backend:latest
          command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: copilot-config
            - secretRef:
                name: copilot-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.core.celery_app", "inspect", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
      terminationGracePeriodSeconds: 120
