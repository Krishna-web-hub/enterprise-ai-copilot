apiVersion: v1
kind: ConfigMap
metadata:
  name: copilot-config
  namespace: ai-copilot
data:
  APP_ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  BACKEND_WORKERS: "4"
  POSTGRES_PORT: "5432"
  REDIS_PORT: "6379"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "documents"
  SQL_MAX_ROWS: "1000"
  SQL_QUERY_TIMEOUT_SECONDS: "15"
  ML_CV_FOLDS: "3"
  ML_TEST_SIZE: "0.2"
  ML_SHAP_SAMPLE_SIZE: "100"
  MAX_UPLOAD_SIZE_MB: "100"
  STORAGE_BACKEND: "s3"
  CORS_ORIGINS: "https://your-domain.com"
  RATE_LIMIT_WINDOW_SECONDS: "60"
