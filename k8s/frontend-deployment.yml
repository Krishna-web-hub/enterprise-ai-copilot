apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-frontend
  namespace: ai-copilot
  labels:
    app: copilot-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: copilot-frontend
  template:
    metadata:
      labels:
        app: copilot-frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/copilot-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-frontend
  namespace: ai-copilot
spec:
  type: ClusterIP
  selector:
    app: copilot-frontend
  ports:
    - port: 80
      targetPort: 80
