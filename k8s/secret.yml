# IMPORTANT: In production, use a secrets manager (AWS Secrets Manager, K8s ExternalSecrets)
# This file is a TEMPLATE — replace base64 values before applying.
# Generate base64: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: copilot-secrets
  namespace: ai-copilot
type: Opaque
data:
  # echo -n "your-jwt-secret-64-chars" | base64
  JWT_SECRET_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE
  # echo -n "your-postgres-password" | base64
  POSTGRES_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
  POSTGRES_HOST: REPLACE_WITH_BASE64_ENCODED_VALUE
  POSTGRES_DB: REPLACE_WITH_BASE64_ENCODED_VALUE
  POSTGRES_USER: REPLACE_WITH_BASE64_ENCODED_VALUE
  # echo -n "sk-your-openai-key" | base64
  OPENAI_API_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE
  # S3 credentials
  S3_BUCKET_NAME: REPLACE_WITH_BASE64_ENCODED_VALUE
  AWS_REGION: REPLACE_WITH_BASE64_ENCODED_VALUE
  AWS_ACCESS_KEY_ID: REPLACE_WITH_BASE64_ENCODED_VALUE
  AWS_SECRET_ACCESS_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE
  # Redis
  REDIS_HOST: REPLACE_WITH_BASE64_ENCODED_VALUE
  # Qdrant
  QDRANT_HOST: REPLACE_WITH_BASE64_ENCODED_VALUE
