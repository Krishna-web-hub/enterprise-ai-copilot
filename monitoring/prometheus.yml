# Prometheus Configuration for Enterprise AI Copilot
# Scrapes the /metrics endpoint on the backend service every 15 seconds.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "copilot-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "copilot-api"
          environment: "development"
